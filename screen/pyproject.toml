[project]
name = "cw-screen"
version = "0.1.2"
description = "The screen: the Combat Writing plugin's full-screen terminal interface, watching a run folder in your own terminal tab."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-PolyForm-Shield-1.0.0"
authors = [{ name = "Learning Producers Inc." }]
dependencies = ["textual==8.2.8"]

[project.scripts]
cw-screen = "cw_screen.app:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cw_screen"]
