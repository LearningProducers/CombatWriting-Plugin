# One job, `checks`, on every pull request targeting main and on each push to main:
# check out the repository, set up Node, install the Claude Code CLI from npm at an
# exact version, run every check in tests/ (files named *_check.js; eleven today),
# then run `claude plugin validate --strict` on the listed plugin, on the add-on and
# on the repository root (the marketplace manifest). Any failing step fails the job.
# `claude plugin validate` needs no login and makes no call with a key.
# Actions are pinned to commits; the comment names the tag the commit carried when pinned.
name: checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install the Claude Code CLI at an exact version
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Run every check in tests/
        run: |
          rc=0
          n=0
          for f in tests/*_check.js; do
            n=$((n + 1))
            echo "== $f"
            node "$f" || rc=1
          done
          echo "ran $n checks"
          [ "$n" -gt 0 ] || rc=1
          exit $rc
      - name: Validate the listed plugin
        run: claude plugin validate --strict plugins/combat-writing
      - name: Validate the add-on
        run: claude plugin validate --strict plugins/combat-writing-crew
      - name: Validate the repository root (the marketplace manifest)
        run: claude plugin validate --strict .
