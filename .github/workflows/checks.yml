# SPDX-License-Identifier: LicenseRef-PolyForm-Shield-1.0.0
# Two jobs.
#
# `checks`, on every pull request targeting main and on each push to main: check out the
# repository, set up Node, run the version-bump gate (pull requests only), install the
# Claude Code CLI from npm at an exact version, run every check in tests/ (files named
# *_check.js; thirteen today), then run `claude plugin validate --strict` on the listed
# plugin, on the add-on and on the repository root (the marketplace manifest). Any failing
# step fails the job. `claude plugin validate` needs no login and makes no call with a key.
#
# The version-bump gate: for each of plugins/combat-writing and plugins/combat-writing-crew,
# if any file under that folder differs from the pull request's base commit, the version in
# that folder's .claude-plugin/plugin.json must differ from the base's. Changes outside the
# two plugin folders (docs, CI, tests) need no bump. The gate fails naming the plugin that
# needs one. The marketplace entry must match each plugin.json version; the validation of
# the repository root and tests/marketplace_check.js already pin that.
#
# `tag`, on push to main only, after `checks` passes: for each plugin, read the version
# from .claude-plugin/plugin.json and, if the tag <plugin-name>--v<version> is not on
# origin, create an annotated tag with that exact name and the message
# "<plugin-name> <version>", then push it. That is the name and the default message
# `claude plugin tag` produces, so a tag made by hand and a tag made here never diverge.
# An already-tagged version is a no-op, not a failure. Then, for each tag with no GitHub
# Release (ruled 2026-10-13), create one titled "<plugin-name> <version>". The notes: a
# hand-written file .github/release-notes/<tag>.md when one is in the tree (its SPDX
# comment line dropped); else the cut from the pull request merged at the tagged commit,
# its title plus its "What changed" section, by .github/scripts/release-notes.js; else,
# when no merged pull request is found at that commit or its body has no "What changed"
# section, GitHub's generated notes counted from the plugin's previous tag. A tag that
# already has a Release is a no-op, so a rerun after a failed Release step finishes the
# job without retagging.
#
# Actions are pinned to commits; the comment names the tag the commit carried when pinned.
name: checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Version-bump gate (pull requests only)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          rc=0
          for p in combat-writing combat-writing-crew; do
            dir="plugins/$p"
            manifest="$dir/.claude-plugin/plugin.json"
            if ! printf '%s\n' "$changed" | grep -q "^$dir/"; then
              echo "$dir: no file changed, no bump needed"
              continue
            fi
            head_v=$(node -p "JSON.parse(require('fs').readFileSync('$manifest','utf8')).version")
            base_v=$(git show "$BASE_SHA:$manifest" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "(none)")
            if [ "$head_v" = "$base_v" ]; then
              echo "::error::$dir changed but its version is still $head_v. Bump version in $manifest and in its entry in .claude-plugin/marketplace.json."
              rc=1
            else
              echo "$dir: changed, version $base_v -> $head_v"
            fi
          done
          exit $rc
      - name: Install the Claude Code CLI at an exact version
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Run every check in tests/
        run: |
          rc=0
          n=0
          for f in tests/*_check.js; do
            n=$((n + 1))
            echo "== $f"
            node "$f" || rc=1
          done
          echo "ran $n checks"
          [ "$n" -gt 0 ] || rc=1
          exit $rc
      - name: Validate the listed plugin
        run: claude plugin validate --strict plugins/combat-writing
      - name: Validate the add-on
        run: claude plugin validate --strict plugins/combat-writing-crew
      - name: Validate the repository root (the marketplace manifest)
        run: claude plugin validate --strict .
  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Tag each plugin version not yet tagged on origin; a Release for each tag without one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --quiet origin
          for p in combat-writing combat-writing-crew; do
            manifest="plugins/$p/.claude-plugin/plugin.json"
            v=$(node -p "JSON.parse(require('fs').readFileSync('$manifest','utf8')).version")
            t="$p--v$v"
            if git ls-remote --exit-code --tags origin "refs/tags/$t" >/dev/null; then
              echo "$t is already on origin; not retagged"
            else
              git tag -a "$t" -m "$p $v"
              git push origin "refs/tags/$t"
              echo "tagged $t at $(git rev-parse HEAD)"
            fi
            if gh release view "$t" >/dev/null 2>&1; then
              echo "$t already has a Release; nothing to do"
              continue
            fi
            sha=$(git rev-list -n1 "$t")
            pr_json="$RUNNER_TEMP/$t.pr.json"
            notes="$RUNNER_TEMP/$t.notes.md"
            if [ -f ".github/release-notes/$t.md" ]; then
              grep -v '^<!-- SPDX-License-Identifier:' ".github/release-notes/$t.md" > "$notes"
              gh release create "$t" --verify-tag --title "$p $v" --notes-file "$notes"
              echo "released $t with notes from .github/release-notes/$t.md"
              continue
            fi
            if gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --jq '[.[] | select(.merged_at != null)] | first // empty' > "$pr_json" \
               && [ -s "$pr_json" ] \
               && node .github/scripts/release-notes.js < "$pr_json" > "$notes"; then
              gh release create "$t" --verify-tag --title "$p $v" --notes-file "$notes"
              echo "released $t with notes from pull request #$(node -p "JSON.parse(require('fs').readFileSync('$pr_json','utf8')).number")"
            else
              prev=$(git tag -l "$p--v*" --sort=-v:refname | grep -vx "$t" | head -n1 || true)
              gh release create "$t" --verify-tag --title "$p $v" --generate-notes ${prev:+--notes-start-tag "$prev"}
              echo "released $t with generated notes (no merged pull request with a What changed section at $sha)"
            fi
          done
